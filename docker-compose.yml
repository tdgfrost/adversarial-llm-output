services:
  adversarial-experiment:
    build:
      context: .
      dockerfile: Dockerfile
    image: adversarial-llm-output:latest
    container_name: adversarial-guardrail-coevolution
    stdin_open: true
    tty: true
    ports:
      - "6006:6006"
    volumes:
      # Mount local ./experimental_results into the container with SELinux (:Z)
      # compatibility for Fedora 41 and full read/write access.
      - ./experimental_results:/app/experimental_results:Z
      - ./src:/app/src:Z
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:Z
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - ENABLE_TENSORBOARD=1
      - NUM_STEPS=${NUM_STEPS:-100}
      - EXTEND_STEPS=${EXTEND_STEPS:-0}
      - FRESH_RUN=${FRESH_RUN:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
